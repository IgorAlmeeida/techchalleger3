name: Build & Sonar

on:
  push:
    branches: [ main ]
  pull_request:

env:
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

jobs:

  # ---------------------------------------------------------------------
  # 1) Build — falha rápido em erro de compilação antes de rodar a suíte
  #    de testes (que é mais lenta, pois sobe containers via Testcontainers).
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests compile

  # ---------------------------------------------------------------------
  # 2) Testes + Cobertura — unitários e de integração (Testcontainers sobe
  #    um Postgres próprio; não depende de services fixos do runner) + BDD
  #    (Cucumber) + gate de cobertura (JaCoCo, 80% em domain/application,
  #    configurado no pom.xml).
  # ---------------------------------------------------------------------
  test:
    name: Testes e Cobertura
    needs: build
    runs-on: ubuntu-latest
    env:
      GMAIL_USERNAME: ci-placeholder@example.com
      GMAIL_APP_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes e checar gate de cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar relatórios de teste (sempre, mesmo em falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/cucumber-reports
          retention-days: 14

      - name: Publicar artefatos de cobertura (para o job do Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            target/classes
            target/test-classes
            target/jacoco.exec
            target/site/jacoco
          retention-days: 1

  # ---------------------------------------------------------------------
  # 3) SonarCloud — reaproveita as classes compiladas e o jacoco.exec do
  #    job anterior em vez de rodar os testes de novo.
  # ---------------------------------------------------------------------
  sonar:
    name: Analise SonarCloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar precisa do histórico completo para "novo código"/blame

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Baixar artefatos de cobertura do job de testes
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifacts
          path: target

      - name: Analise Sonar (sem re-rodar os testes)
        run: |
          chmod +x mvnw
          ./mvnw -B sonar:sonar \
            -Dmaven.test.skip=true \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.organization=$SONAR_ORGANIZATION \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------
  # 4) Publicação da imagem no GitHub Container Registry (GHCR) — só
  #    roda em push na main, e só depois de testes + Sonar passarem.
  # ---------------------------------------------------------------------
  docker-publish:
    name: Build e Push da imagem (GHCR)
    needs: [ test, sonar ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nome da imagem (minúsculo é exigido pelo GHCR)
        id: image
        run: |
          echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados / tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
