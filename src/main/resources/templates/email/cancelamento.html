<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head><meta charset="UTF-8"/></head>
<body style="margin: 0; padding: 0; background-color: #FAFAFA;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FAFAFA;">
  <tr><td align="center" style="padding: 30px 10px;">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background-color: #FFFFFF; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
      <tr><td th:replace="~{email/layout-base :: cabecalho}"></td></tr>
      <tr><td style="padding: 30px;">
        <h2 style="margin: 0 0 16px; font-size: 20px; color: #B71C1C; font-family: Arial, sans-serif;">
          Agendamento Cancelado
        </h2>
        <p style="margin: 0 0 20px; font-size: 15px; color: #424242; font-family: Arial, sans-serif; line-height: 1.5;">
          O seu agendamento foi cancelado no sistema Agendamento.
        </p>
        <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FFEBEE; border-left: 4px solid #B71C1C; border-radius: 4px; margin-bottom: 20px;">
          <tr><td style="padding: 16px;">
            <p style="margin: 0; font-size: 13px; color: #757575; font-family: Arial, sans-serif;">N&#250;mero do agendamento cancelado</p>
            <p style="margin: 4px 0 12px; font-size: 22px; font-weight: bold; color: #B71C1C; font-family: Arial, sans-serif;" th:text="${agendamentoId}">---</p>

            <div th:if="${itemNome != null}" style="margin-bottom: 12px;">
              <p style="margin: 0; font-size: 13px; color: #757575; font-family: Arial, sans-serif;">Serviço</p>
              <p style="margin: 4px 0 0; font-size: 16px; font-weight: bold; color: #212121; font-family: Arial, sans-serif;" th:text="${itemNome}">---</p>
            </div>

            <div th:if="${profissionalNome != null}" style="margin-bottom: 12px;">
              <p style="margin: 0; font-size: 13px; color: #757575; font-family: Arial, sans-serif;">Profissional</p>
              <p style="margin: 4px 0 0; font-size: 16px; font-weight: bold; color: #212121; font-family: Arial, sans-serif;" th:text="${profissionalNome}">---</p>
            </div>

            <div th:if="${data != null}" style="margin-bottom: 12px;">
              <p style="margin: 0; font-size: 13px; color: #757575; font-family: Arial, sans-serif;">Data</p>
              <p style="margin: 4px 0 0; font-size: 16px; font-weight: bold; color: #212121; font-family: Arial, sans-serif;" th:text="${data}">--/--/----</p>
            </div>
          </td></tr>
        </table>
        <p style="margin: 0; font-size: 14px; color: #616161; font-family: Arial, sans-serif; line-height: 1.5;">
          Se precisar de um novo agendamento, acesse o sistema Agendamento.
        </p>
      </td></tr>
      <tr><td th:replace="~{email/layout-base :: rodape}"></td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
