spring:
  application:
    name: agendamento
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: agd
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:agendamento}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:agendamento}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/agendamento
          jwk-set-uri: http://localhost:8180/realms/agendamento/protocol/openid-connect/certs

keycloak:
  server-url: http://localhost:8180
  realm: agendamento
  client-id: agendamento-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
