spring:
  application:
    name: agendamento
  jackson:
    serialization:
      write-dates-as-timestamps: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: agd
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:agendamento}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-minimo-32-caracteres-aqui}
  expiration-segundos: 1800
  refresh-expiration-segundos: 604800

google:
  calendar:
    client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integracoes/google/callback}
